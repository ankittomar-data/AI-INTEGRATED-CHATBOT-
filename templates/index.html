<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Study Chatbot</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1c2033; --me:#3b4cca; --bot:#e9ebf5; --border:#d9dcea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161f; --card:#1c1f2c; --text:#e8eaf4; --me:#5566e0; --bot:#2a2e40; --border:#343850; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
         height:100vh; display:flex; justify-content:center; }
  main { width:100%; max-width:720px; display:flex; flex-direction:column; height:100%; background:var(--card); }
  header { padding:14px 18px; border-bottom:1px solid var(--border); font-weight:600; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--me); color:#fff; }
  .bot { align-self:flex-start; background:var(--bot); }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--border); }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--border);
          background:var(--bg); color:var(--text); font-size:16px; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--me); color:#fff; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.5; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--me); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <header>AI Study Chatbot</header>
  <div id="log"><div class="msg bot">Hi! Ask me anything about your coursework.</div></div>
  <form id="form">
    <input id="input" placeholder="Type your question" autocomplete="off" required>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById("log"), form = document.getElementById("form"),
        input = document.getElementById("input"), send = document.getElementById("send");
  const history = [];

  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls; d.textContent = text;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim(); if (!text) return;
    input.value = ""; send.disabled = true;
    add(text, "me"); history.push({ role: "user", content: text });
    const pending = add("Thinking...", "bot");
    try {
      const res = await fetch("/api/chat", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      pending.textContent = data.reply; history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      pending.textContent = "Error: " + err.message; history.pop();
    }
    send.disabled = false; input.focus(); log.scrollTop = log.scrollHeight;
  });
</script>
</body>
</html>
